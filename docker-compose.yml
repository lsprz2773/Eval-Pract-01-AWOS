services:
  db:
    image: postgres:16-alpine
    container_name: ev_pr01_awos
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ev_pr01
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./db/migrate.sql:/docker-entrypoint-initdb.d/03-migrate.sql
      - ./db/reports_vw.sql:/tmp/reports_vw.sql
      - ./db/indexes.sql:/tmp/indexes.sql
      - ./db/roles.sql:/tmp/roles.sql
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

